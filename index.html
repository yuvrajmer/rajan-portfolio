<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rajan Tarakhala — 2D/3D Motion Artist</title>
    <meta
      name="description"
      content="Rajan Tarakhala is a 2D/3D motion artist creating character-driven animation, VFX and campaign motion for tourism, sport and government brands in Sharjah, UAE."
    />
    <meta name="theme-color" content="#060714" />
    <!-- Apply the saved theme before first paint (no dark→light flash). Default stays dark.
         The light hex below mirrors --c-bg in styles/theme.css; lib/theme.ts reads the token after that. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light") {
            document.documentElement.setAttribute("data-theme", "light");
            document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F7F4ED");
          }
        } catch (e) {}
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rajan Tarakhala — 2D/3D Motion Artist" />
    <meta
      property="og:description"
      content="Character-driven animation, built frame by frame. Selected work for F1H2O, SCTDA, Visit Sharjah, Shurooq and more."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23060714'/><circle cx='12' cy='16' r='7' fill='%239F9AFF' fill-opacity='.45'/><circle cx='19' cy='16' r='7' fill='%23FF7B39'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/fonts/NeueMachina-Medium.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
